name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Run tests
        run: >
          npx tsx --test
          --test-reporter=spec
          --test-reporter=node-test-github-reporter
          --test-reporter-destination=stdout
          --test-reporter-destination=stdout
          "test/*.selfcheck.ts"
